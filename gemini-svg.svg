<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Fondo Gradiente Oscuro -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Gradiente Tech Cyan / Neon Purple -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Efecto Neón / Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo Base con bordes redondeados -->
  <rect width="800" height="800" fill="url(#bgGrad)" rx="40"/>

  <!-- Cuadrícula / Patrón de Fondo Tech -->
  <g stroke="#1e293b" stroke-width="1.5" opacity="0.5">
    <path d="M 0,100 H 800 M 0,200 H 800 M 0,300 H 800 M 0,400 H 800 M 0,500 H 800 M 0,600 H 800 M 0,700 H 800" stroke-dasharray="4,8"/>
    <path d="M 100,0 V 800 M 200,0 V 800 M 300,0 V 800 M 400,0 V 800 M 500,0 V 800 M 600,0 V 800 M 700,0 V 800" stroke-dasharray="4,8"/>
  </g>

  <!-- Elemento Central -->
  <g transform="translate(0, -20)">
    <!-- Marco y Brackets de Código Vectoriales -->
    <g stroke="url(#primaryGrad)" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <!-- Bracket Izquierdo -->
      <path d="M 320 250 L 230 320 L 320 390" />
      <!-- Bracket Derecho -->
      <path d="M 480 250 L 570 320 L 480 390" />
      
      <!-- Nodos de Circuito -->
      <circle cx="230" cy="320" r="7" fill="#38bdf8" stroke="none"/>
      <circle cx="570" cy="320" r="7" fill="#c084fc" stroke="none"/>
      
      <!-- Líneas Decorativas Superior e Inferior -->
      <path d="M 360 210 L 440 210" stroke-dasharray="6 6" stroke-width="6"/>
      <path d="M 330 430 L 470 430" stroke-width="6"/>
    </g>

    <!-- Texto Principal -->
    <text x="400" y="540" 
          text-anchor="middle" 
          fill="url(#primaryGrad)" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="72" 
          font-weight="800" 
          letter-spacing="1">
      JrPrograms
    </text>

    <!-- Subtítulo -->
    <text x="400" y="600" 
          text-anchor="middle" 
          fill="#94a3b8" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="20" 
          font-weight="600" 
          letter-spacing="8">
      SOFTWARE DEVELOPER
    </text>
  </g>
</svg>
